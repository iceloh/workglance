name: release
# Push a tag vX.Y.Z (matching package.json) and this publishes it:
# - npm, through npm's trusted publishing (OIDC from this workflow, no token stored anywhere);
# - the VS Code extension to the Marketplace, if a VSCE_PAT secret exists (otherwise skipped);
# - a GitHub release with the extension's .vsix attached (for manual upload or install).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1+; the runner's Node may ship an older one.
      - run: npm install -g npm@11 && npm --version
      # prepublishOnly builds and tests again. On failure, npm's own message becomes an annotation: job logs
      # are only visible when logged in, annotations are public.
      - name: npm publish
        shell: bash
        run: |
          set -o pipefail
          npm publish --provenance --access public 2>&1 | tee publish.log || {
            echo "::error title=npm publish failed::$(grep -E 'npm (error|ERR)' publish.log | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
      - name: Package the VS Code extension
        run: cd vscode && npx --yes @vscode/vsce@3 package --skip-license -o ../workglance-vscode.vsix
      - name: Publish the extension (only with a VSCE_PAT secret; an unchanged version is skipped)
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath workglance-vscode.vsix --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" workglance-vscode.vsix --title "$GITHUB_REF_NAME" --generate-notes
